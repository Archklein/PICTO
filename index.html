<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Localized Market" />
    <title>PCT - Localized Market</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="navtop">
      <div class="logo_div">
        <div class="logo">
          <img src="images/PCT_Logo_Transparent.png" alt="PCT Logo" />
        </div>
      </div>

      <input type="checkbox" name="" id="menu_toggle" />
      <label for="menu_toggle">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-text-align-justify preview-icon"
        >
          <path d="M3 5h18" />
          <path d="M3 12h18" />
          <path d="M3 19h18" />
        </svg>
      </label>

      <label class="overlay" for="menu_toggle"></label>

      <div class="menu_list">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Settings</a>
        <a href="#">Theme</a>
        <a href="#">PCT Website</a>
      </div>
    </nav>
  </body>
</html>
