<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Localized Market" />
    <title>PCT - Localized Market</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="navtop">
      <div class="logo">
        <img src="images/PCT_Logo_Transparent.png" alt="" />
      </div>
      <label for="menu_toggle">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-text-align-justify preview-icon"
        >
          <path d="M3 5h18" />
          <path d="M3 12h18" />
          <path d="M3 19h18" />
        </svg>
      </label>
      <input type="checkbox" name="" id="menu_toggle" />
      <label class="nav_top_overlay" for="menu_toggle"></label>
      <div class="menu_list">
        <div class="menu_content">
          <div class="menu_exit_section">
            <h3>PICTO</h3>

            <label for="menu_toggle">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
          </div>

          <div class="menu_links">
            <a href="#">Home</a>
            <a href="#">Sell an Item</a>
            <a href="#">My Listings</a>
            <a href="#">Meetup Zones</a>
            <a href="#">Rules & Safety</a>
            <a href="#">Profile / Account</a>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
